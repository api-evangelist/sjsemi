aid: sjsemi
name: SJSemi
description: 'SJSemi (SJSemiconductor (Jiangyin) Corp.) is a Chinese semiconductor
  Middle-End-Of-Line (MEOL) pure-play foundry and outsourced assembly and test (OSAT)
  provider, founded in 2014 as a joint venture between JCET and SMIC and headquartered
  in the Jiangyin High-Tech Industrial Development Zone, Jiangsu, with offices in
  Shanghai and Santa Clara, California. The company operates a 12-inch wafer bumping,
  wafer-level chip-scale packaging, chip probing and final-test line, and supplies
  advanced packaging and 3D multi-die integration services — Cu pillar, RDL, fan-out,
  TSV and silicon interposer 2.5D — into smartphone, 5G communications, high-performance
  computing, data-center and automotive electronics supply chains. It is a contract
  manufacturer of physical semiconductor packaging services and publishes no public
  developer program, API, or machine-readable interface contract.'
